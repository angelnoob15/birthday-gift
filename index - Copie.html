<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>For Nafissa 💗</title>

  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;

      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #ff9a9e, #fad0c4, #fbc2eb);

      overflow: hidden;
    }

    .card {
      width: 100%;
      max-width: 500px;
      background: rgba(255, 255, 255, 0.95);
      padding: 35px 25px;
      border-radius: 30px;
      text-align: center;

      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.15);

      animation: appear 1s ease;
    }

    @keyframes appear {
      from {
        opacity: 0;
        transform: scale(0.8);
      }

      to {
        opacity: 1;
        transform: scale(1);
      }
    }

    .cake {
      font-size: 70px;
      animation: bounce 2s infinite;
    }

    @keyframes bounce {
      0%, 100% {
        transform: translateY(0);
      }

      50% {
        transform: translateY(-10px);
      }
    }

    h1 {
      color: #ec4899;
      font-size: 38px;
      margin: 15px 0;
    }

    .message {
      color: #444;
      font-size: 18px;
      line-height: 1.7;
      margin-top: 20px;
    }

    .highlight {
      color: #ec4899;
      font-weight: bold;
    }

    button {
      margin-top: 25px;
      padding: 14px 25px;
      border: none;
      border-radius: 15px;

      background: linear-gradient(135deg, #ec4899, #a855f7);
      color: white;

      font-size: 17px;
      font-weight: bold;

      cursor: pointer;

      box-shadow: 0 8px 20px rgba(236, 72, 153, 0.3);

      transition: 0.2s;
    }

    button:hover {
      transform: scale(1.05);
    }

    button:active {
      transform: scale(0.95);
    }

    #surprise {
      display: none;
      margin-top: 25px;
      font-size: 22px;
      color: #a855f7;
      font-weight: bold;
      animation: pop 0.5s ease;
    }

    @keyframes pop {
      0% {
        transform: scale(0);
      }

      80% {
        transform: scale(1.1);
      }

      100% {
        transform: scale(1);
      }
    }

    .emojis {
      font-size: 35px;
      margin-top: 20px;
    }

    /* Mobile */
    @media (max-width: 500px) {
      .card {
        padding: 30px 20px;
      }

      .cake {
        font-size: 60px;
      }

      h1 {
        font-size: 32px;
      }

      .message {
        font-size: 16px;
      }
    }
  </style>
</head>

<body>

  <div class="card">

    <div class="cake">🎂</div>

    <h1>Hiii Nafissa 💗</h1>

    <div class="emojis">
      🎀 🎉 🎁 🎈
    </div>

    <p class="message">
      Hiii Nafissa!! 💗<br><br>

      I know I'm kinda late 😭 but I told you I was gonna
      <span class="highlight">gift you something</span>,
      so I made this for you as my gift. 🥹💗
      <br><br>

      I hope you like ittt!! 🎀
      <br><br>

      <span class="highlight">Happy Birthday!! 🥳🎂</span>
    </p>

    <button onclick="celebrate()">
      Click me 🎁
    </button>

    <div id="surprise">
      🎉 SURPRISEEE 🎉
      <br>
      <span style="font-size: 17px; color: #555;">
        Hope you have an amazing birthday Nafissa 💗
      </span>
    </div>

  </div>

  <script>
    function celebrate() {

      document.getElementById("surprise").style.display = "block";

      // Main confetti
      confetti({
        particleCount: 200,
        spread: 100,
        startVelocity: 45,
        origin: {
          x: 0.5,
          y: 0.6
        }
      });

      // Left side
      setTimeout(() => {
        confetti({
          particleCount: 100,
          spread: 90,
          origin: {
            x: 0.1,
            y: 0.7
          }
        });
      }, 300);

      // Right side
      setTimeout(() => {
        confetti({
          particleCount: 100,
          spread: 90,
          origin: {
            x: 0.9,
            y: 0.7
          }
        });
      }, 600);

      // Final burst
      setTimeout(() => {
        confetti({
          particleCount: 150,
          spread: 160,
          startVelocity: 40,
          origin: {
            x: 0.5,
            y: 0.3
          }
        });
      }, 900);
    }
  </script>

</body>
</html>
